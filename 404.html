<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <script>
      /* Tema: preferencia guardada (localStorage) o la del sistema. Se ejecuta antes del primer
         pintado para evitar destellos. Mantener sincronizado con theme.ts */
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
        var c = t === 'dark' ? '#0f172a' : '#f8fafc';
        var m = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < m.length; i++) m[i].setAttribute('content', c);
      })();
    </script>
    <title>Página no encontrada | Aitor's Hub</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body class="bg-page text-ink antialiased selection:bg-brand-100 selection:text-brand-700 dark:selection:bg-brand-500/40 dark:selection:text-white">
    <main class="mx-auto flex min-h-screen max-w-xl flex-col items-center justify-center px-6 py-16 text-center">
      <p class="text-sm font-semibold uppercase tracking-widest text-accent">Error 404</p>
      <h1 class="mt-3 text-3xl font-bold tracking-tight text-ink sm:text-4xl">Página no encontrada</h1>
      <p class="mt-4 text-lg text-body">La dirección que has abierto no existe o ha cambiado de sitio. Busca la herramienta que necesitas o vuelve al inicio.</p>

      <!-- Funciona sin JavaScript: el hub lee ?q= y filtra las herramientas -->
      <form action="/" method="get" role="search" class="mt-8 w-full max-w-md">
        <label for="q" class="sr-only">Buscar herramientas</label>
        <input id="q" name="q" type="search" autocomplete="off" placeholder="Buscar herramienta o enlace..."
               class="block w-full rounded-xl border border-control bg-surface px-4 py-3 text-ink shadow-sm placeholder:text-muted" />
      </form>

      <a href="/" class="mt-6 inline-flex items-center rounded-xl bg-brand-600 px-5 py-3 font-medium text-white transition-colors hover:bg-brand-700">Volver a Aitor's Hub</a>
    </main>
  </body>
</html>
