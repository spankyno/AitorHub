    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <script>
      /* Tema: preferencia guardada (localStorage) o la del sistema. Se ejecuta antes del primer
         pintado para evitar destellos. Mantener sincronizado con theme.ts */
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
        var c = t === 'dark' ? '#0f172a' : '#f8fafc';
        var m = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < m.length; i++) m[i].setAttribute('content', c);
      })();
    </script>

<!-- Analítica propia (Cloudflare Worker): carga diferida en periodos de inactividad -->
<script>
  window.addEventListener('load', function() {
    var loadTracker = function() {
      var t = document.createElement('script');
      t.src = 'https://aitors-hub-dashboard.asanchezgu.workers.dev/tracker.js';
      t.setAttribute('data-app', 'aitor-hub');
      t.setAttribute('data-key', 'ak_e279ba09f6f740a2b0d605820a02b0a2');
      t.async = true;
      document.head.appendChild(t);
    };

    if ('requestIdleCallback' in window) {
      requestIdleCallback(loadTracker);
    } else {
      setTimeout(loadTracker, 1);
    }
  });
</script>
