# Mantiene al día dependencias y acciones de GitHub: la mayoría de los avisos de seguridad
# de este proyecto (Vite, PostCSS…) se resuelven simplemente actualizando.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
